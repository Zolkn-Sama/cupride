[workspace]
resolver = "3"
members = [
    "app",
    "crates/text",
    "crates/layout",
    "crates/core",
    "crates/render",
    "crates/ui",
    "tools/repl",
]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Zolkn-Sama/cupride"
publish = false

# Versions centralisées : les crates déclarent `<dep>.workspace = true`.
[workspace.dependencies]
# Crates internes
cupride-text = { path = "crates/text" }
cupride-layout = { path = "crates/layout" }
cupride-core = { path = "crates/core" }
cupride-render = { path = "crates/render" }
cupride-ui = { path = "crates/ui" }

# Erreurs : thiserror dans les bibliothèques, anyhow dans les binaires.
anyhow = "1.0.100"
thiserror = "2.0.17"

# Texte
unicode-segmentation = "1.13.3"

# Noyau : identifiants, commandes, configuration
clap = { version = "4.6.8", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }
serde = { version = "1.0.229", features = ["derive"] }
shlex = "2.0.1"
slotmap = "1.1.1"
strsim = "0.11.1"
tempfile = "3.27.0"
toml = "1.2.1"

# Tests et mesures
criterion = "0.8.2"
png = "0.18.1"
proptest = "1.12.0"

# Fenêtres, GPU et texte
winit = "0.30.13"
wgpu = "30.0.2"
glyphon = "0.12.0"
pollster = "0.4.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
arboard = "3.7.0"

# Journalisation
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing-appender = "0.2.3"

# Dossiers standards de chaque OS (configuration, données, cache)
directories = "6.0.0"

# Règles communes, activées dans chaque crate par `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Profil de release : binaire le plus petit et le plus rapide possible.
[profile.release]
lto = true
codegen-units = 1
strip = true
